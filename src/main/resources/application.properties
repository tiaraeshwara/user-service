spring.application.name=user-service

spring.datasource.url=jdbc:postgresql://localhost:5432/user_service_db?currentSchema=ts
spring.datasource.username=postgres
spring.datasource.password=admin
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=ts
spring.jpa.show-sql=true
spring.jpa.hibernate.naming-strategy=org.hibernate.cfg.ImprovedNamingStrategy

#User DB CONFIGURATION
spring.datasource-user.driver-class-name=org.postgresql.Driver
spring.datasource-user.jdbc-url=jdbc:postgresql://localhost:5432/user_service_db?currentSchema=ts
spring.datasource-user.username=postgres
spring.datasource-user.password=admin
spring.datasource-user.continueOnError=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.url=jdbc:postgresql://localhost:5432/user_service_db?currentSchema=ts
spring.flyway.user=postgres
spring.flyway.password=admin
